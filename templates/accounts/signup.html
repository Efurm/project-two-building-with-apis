{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Create an account</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-full mt-4">Sign up</button>
    </form>
    <p class="text-sm mt-2">Already have an account? <a class="link" href="{% url 'accounts:login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
