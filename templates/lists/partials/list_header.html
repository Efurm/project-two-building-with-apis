<div id="list-header" class="flex flex-wrap items-center justify-between gap-2 mb-4">
  <h1 class="text-2xl font-bold">{{ movie_list.name }}</h1>
  <div class="flex gap-2">
    <a href="{% url 'lists:rename' movie_list.pk %}" class="btn btn-sm"
       hx-get="{% url 'lists:rename' movie_list.pk %}" hx-target="#list-header" hx-swap="outerHTML">Rename</a>
    <a href="{% url 'lists:delete' movie_list.pk %}" class="btn btn-sm btn-error btn-outline"
       hx-get="{% url 'lists:delete' movie_list.pk %}" hx-target="#modal">Delete list</a>
  </div>
</div>
